name: Deploy site

# 站点源码就在仓库根目录，改了才重建。
# DOC/ 也要监听 —— MCP.md / SKILL.md 会被渲染成 /docs/ref/ 下的页面。
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'DOC/**'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  schedule:
    # 每天 04:00（UTC+8）重建一次：首页「国内加速下载」链接是构建时解析最新 Release 的，
    # 定时重建才能在新版本发布后自动跟上。
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署，后到的取消先到的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
